name: student-management
include:
  - compose.monitoring.yaml
  - compose.logging.yaml
services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, frontend]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  web:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:?Create .env first}
      DB_USER: ${MYSQL_USER:?Create .env first}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Create .env first}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [backend]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports: ["127.0.0.1:8081:80"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, backend]
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  edge:
  frontend:
    internal: true
  backend:
    internal: true
volumes:
  mysql_data:
