services:
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./logging/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports: ["127.0.0.1:3100:3100"]
    networks: [edge, monitoring]
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  promtail:
    image: grafana/promtail:3.4.2
    user: "0:0"
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./logging/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on: [loki]
    networks: [monitoring]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  loki_data:
  promtail_positions:
